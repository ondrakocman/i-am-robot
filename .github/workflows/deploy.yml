name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install numpy==2.4.2
      - run: npm run lint
      - run: npm test
      - run: node scripts/sim-check.mjs all n=2 out=/tmp/all.iamr
      # the same file path a headset download takes: decode in Node and in Python, replay, dump poses
      - run: node scripts/replay.mjs /tmp/all.iamr /tmp/poses.ndjson
      - run: python3 scripts/load_episodes.py /tmp/all.iamr
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploys exactly the build the check job verified
      - id: deployment
        uses: actions/deploy-pages@v4
