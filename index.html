<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>I Am Robot — Unitree G1 VR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; }

    #ui-overlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 100;
      pointer-events: none;
    }

    .vr-btn-row {
      display: flex;
      gap: 12px;
      pointer-events: all;
    }

    .vr-btn {
      pointer-events: all;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #00d4ff;
      border: 1px solid #00d4ff44;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      box-shadow: 0 0 30px #00d4ff22;
    }
    .vr-btn:hover {
      background: linear-gradient(135deg, #00d4ff22, #0066ff22);
      box-shadow: 0 0 50px #00d4ff44;
      border-color: #00d4ff88;
    }

    .mode-desc {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 2px;
      font-weight: 400;
    }

    #status, #sim-status {
      color: #ffffff66;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    #task-row {
      pointer-events: all;
      color: #ffffff99;
      font-size: 13px;
    }
    #task-row select {
      margin-left: 8px;
      background: #16213e;
      color: #00d4ff;
      border: 1px solid #00d4ff44;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
    }
    #episodes {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: all;
      color: #ffffff99;
      font-size: 13px;
    }
    #episodes[hidden] { display: none; }
    .small-btn {
      background: transparent;
      color: #00d4ff;
      border: 1px solid #00d4ff44;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .small-btn:disabled { opacity: 0.35; cursor: default; }

    #instructions {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff44;
      font-size: 12px;
      text-align: center;
      letter-spacing: 0.06em;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="ui-overlay">
    <div class="vr-btn-row">
      <button id="enter-vr" class="vr-btn">
        Enter VR
        <span class="mode-desc">You stand where the robot stands</span>
      </button>
    </div>
    <label id="task-row">Task
      <select id="task"></select>
    </label>
    <span id="status">Quest 3 · Hand Tracking Required</span>
    <span id="sim-status"></span>
    <div id="episodes" hidden>
      <span id="episode-count">No episodes recorded yet</span>
      <button id="download-episodes" class="small-btn" disabled>Download</button>
      <button id="clear-episodes" class="small-btn" disabled>Clear</button>
    </div>
  </div>
  <div id="instructions">Open this page in the Meta Quest browser and allow hand tracking</div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
